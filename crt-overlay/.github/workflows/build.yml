name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: crt-overlay-windows-x64.zip
          # Built with zig against glibc 2.31: runs on Debian 11+/Devuan 4+,
          # Ubuntu 20.04+ and newer.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            zigtarget: x86_64-unknown-linux-gnu.2.31
            archive: crt-overlay-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (Linux, old glibc)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --user --break-system-packages ziglang==0.14.1
          cargo install cargo-zigbuild --locked
          cargo zigbuild --release --target ${{ matrix.zigtarget }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/crt-overlay.exe, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/crt-overlay README.md LICENSE dist/
          tar -C dist -czf ${{ matrix.archive }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
