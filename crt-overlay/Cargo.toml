[package]
name = "crt-overlay"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Full-screen CRT-Guest-Advanced shader overlay for the Windows/Linux desktop, controlled from the system tray"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
anyhow = "1"
dirs = "7"
env_logger = "0.11"
glow = "0.17" # must match the version used by librashader-runtime-gl
glutin = "0.32"
glutin-winit = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
include_dir = "0.7"
librashader = { version = "0.12", default-features = false, features = ["runtime-gl", "presets", "preprocess", "reflect", "runtime"] }
log = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "1"
toml_edit = "0.25"
winit = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
# KSNI = StatusNotifierItem over D-Bus: no GTK main loop and no GTK dev packages needed.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
x11rb = { version = "0.13", features = ["shm", "composite", "allow-unsafe-code"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
