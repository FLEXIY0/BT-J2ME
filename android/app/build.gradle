// BT-J2ME для Android: нативная часть — тот же C-код, что и на ПК (src/), плюс SDL2.
// SDL2 подкладывает tools/build-android.sh: app/jni/SDL → исходники SDL2 (в git не хранятся).
plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.flexiy0.btj2me'
    compileSdk 34
    ndkVersion '23.2.8568313'   // r23c — последний NDK, что собирает под Android 4.1

    defaultConfig {
        applicationId 'ru.flexiy0.btj2me'
        minSdk 16            // Android 4.1 Jelly Bean — ниже не пускает SDL2 (EGL/GLES2); 64-битные ABI сами от 5.0
        targetSdk 34
        versionCode 1
        versionName '0.1'
        externalNativeBuild {
            cmake {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // подпись отладочным ключом: APK ставится «как есть»; для магазина — свой ключ
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    sourceSets {
        main {
            java.srcDirs += ['jni/SDL/android-project/app/src/main/java']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false   // lint не нужен для сборки и тянет лишние зависимости
    }
}
